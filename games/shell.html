<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04080f" />
<meta name="description" content="Frost Arcade — a collection of neon-frost arcade games built with HTML5 Canvas and vanilla JavaScript." />
<title>Frost Arcade ❄️</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='40%25'%3E%3Cstop offset='0' stop-color='%23eafaff'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%2308182e'/%3E%3Ccircle cx='16' cy='14' r='7' fill='url(%23g)'/%3E%3Crect x='6' y='24' width='20' height='4' rx='2' fill='%23bae6fd'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="shared/arcade.css" />
</head>
<body>

<div class="ambient-snow" aria-hidden="true">
  <i style="--x:4%;  --d:17s; --s:5px;  --o:.5"></i>
  <i style="--x:12%; --d:23s; --s:3px;  --o:.35"></i>
  <i style="--x:21%; --d:14s; --s:7px;  --o:.25"></i>
  <i style="--x:30%; --d:26s; --s:4px;  --o:.45"></i>
  <i style="--x:39%; --d:19s; --s:6px;  --o:.3"></i>
  <i style="--x:48%; --d:29s; --s:3px;  --o:.55"></i>
  <i style="--x:57%; --d:15s; --s:8px;  --o:.22"></i>
  <i style="--x:66%; --d:24s; --s:4px;  --o:.4"></i>
  <i style="--x:75%; --d:18s; --s:6px;  --o:.28"></i>
  <i style="--x:84%; --d:27s; --s:3px;  --o:.5"></i>
  <i style="--x:92%; --d:21s; --s:7px;  --o:.3"></i>
</div>
<div class="ambient-aurora" aria-hidden="true"></div>

<main class="shell" id="shell">

  <header class="hud">
    <div class="hud-brand">
      <span class="brand-icon">❄️</span>
      <span class="brand-text">Frost Arcade</span>
    </div>

    <div class="hud-actions">
      <button type="button" class="icon-btn" id="btnBack" title="Back to games" aria-label="Back to game selector" hidden>
        <span class="ico-back">🏠</span>
      </button>
      <button type="button" class="icon-btn" id="btnSettings" title="Settings" aria-label="Open settings">
        <span class="ico-settings">⚙</span>
      </button>
      <button type="button" class="icon-btn" id="btnBoard" title="Leaderboards" aria-label="Open leaderboards">
        <span class="ico-board">🏆</span>
      </button>
      <button type="button" class="icon-btn" id="btnFullscreen" title="Fullscreen (F)" aria-label="Toggle fullscreen" aria-pressed="false">
        <span class="ico-fullscreen">↗</span>
      </button>
      <button type="button" class="icon-btn" id="btnSound" title="Mute / Unmute (M)" aria-label="Toggle sound" aria-pressed="false">
        <span class="ico-sound">🔊</span>
      </button>
      <button type="button" class="icon-btn" id="btnPause" title="Pause (P / Esc)" aria-label="Pause game" aria-pressed="false">
        <span class="ico-pause">❚❚</span>
      </button>
    </div>
  </header>

  <section id="game-selector" class="selector" hidden>
    <h2 class="selector-title">Select Game</h2>
    <div class="arcade-toolbar">
      <input type="search" id="arcadeSearch" placeholder="🔍 Search games…" aria-label="Search games" />
      <div class="arcade-filters" role="tablist" aria-label="Filter">
        <button type="button" class="chip-btn active" data-filter="all">All</button>
        <button type="button" class="chip-btn" data-filter="fav">★ Favorites</button>
        <button type="button" class="chip-btn" data-filter="recent">🕘 Recent</button>
      </div>
    </div>
    <div class="selector-grid"></div>
    <p class="arcade-meta" id="arcadeMeta"></p>
  </section>

  <section id="game-host" class="game-host" hidden></section>
  <div class="touch-controls" id="touchControls" hidden></div>

  <section id="board-overlay" class="settings-overlay" hidden>
    <div class="settings-panel board-panel" role="dialog" aria-label="Leaderboards">
      <h2 class="settings-title">Leaderboards 🏆</h2>
      <label class="set-row"><span>Player name</span>
        <input type="text" id="boardName" maxlength="12" class="name-input" />
      </label>
      <div class="board-tabs" id="boardTabs" role="tablist" aria-label="Games"></div>
      <ol class="arcade-board" id="boardList"></ol>
      <div class="btn-row"><button type="button" class="done-btn" id="btnBoardClose">Done</button></div>
    </div>
  </section>

  <section id="settings-overlay" class="settings-overlay" hidden>
    <div class="settings-panel" role="dialog" aria-label="Arcade settings">
      <h2 class="settings-title">Settings ⚙</h2>
      <p class="settings-note">One panel for every game. Difficulty applies on the next game.</p>
      <label class="set-row"><span>Difficulty<small>Chill slower · Blizzard faster</small></span>
        <select id="setDifficulty"><option value="chill">Chill</option><option value="normal">Normal</option><option value="blizzard">Blizzard</option></select>
      </label>
      <label class="set-row"><span>Volume<small>Master sound level</small></span>
        <span class="vol-wrap"><input type="range" id="setVolume" min="0" max="1" step="0.05" value="0.8" /> <b id="setVolumeVal">80%</b></span>
      </label>
      <label class="set-row"><span>Screen shake</span><input type="checkbox" id="setShake" checked /></label>
      <label class="set-row"><span>Particles</span><input type="checkbox" id="setParticles" checked /></label>
      <label class="set-row"><span>Flashes</span><input type="checkbox" id="setFlash" checked /></label>
      <div class="btn-row"><button type="button" class="done-btn" id="btnSettingsClose">Done</button></div>
    </div>
  </section>

</main>

<footer class="arcade-footer">
  <span>Vanilla JS · Canvas · No dependencies</span>
  <span class="footer-games">Frost Breakout • Frost Pong • Frost Snake • Frost Asteroids • Frost Pinball • Frost Hoops</span>
</footer>

<script type="module" src="shared/gameshell.js?v=2"></script>
</body>
</html>
